<!-- Tema calcolato PRIMA del primo paint, o si vede un lampo di bianco
     entrando su una pagina che finirà scura. Scelta manuale se c'è,
     altrimenti l'ora: 08:00-19:59 chiaro, il resto scuro.

     Stessa cosa per il movimento: la scelta fatta con il tasto vale da subito,
     prima che il foglio di stile decida. Senza scelta manuale non si scrive
     nessuna classe e comanda @media (prefers-reduced-motion). -->
<script>
(function(){try{var g=function(k){try{return localStorage.getItem(k)}catch(e){return null}};
var t=g("rsm-theme-mode")==="manual"?(g("rsm-theme-manual")==="dark"?"dark":"light"):((new Date().getHours()>=8&&new Date().getHours()<20)?"light":"dark");
var d=document.documentElement;d.classList.toggle("dark",t==="dark");d.setAttribute("data-rsm-theme",t);
d.style.setProperty("--ap-boot-bg",t==="dark"?"#141414":"#fcfcfc");
var m=g("rsm-motion-mode")==="manual"?g("rsm-motion-manual"):null;
if(m==="on")d.classList.add("rsm-motion");else if(m==="off")d.classList.add("rsm-still")}catch(e){}})();
</script>
