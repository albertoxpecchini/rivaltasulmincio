<main class="container rsm-page">

  <!-- INTESTAZIONE -->
  <div class="d-flex align-items-start justify-content-between flex-wrap gap-3 mb-4">
    <div>
      <p class="text-primary fw-semibold text-uppercase small mb-1">Area riservata · Rivalta sul Mincio</p>
      <h1 class="mb-1">Dashboard</h1>
      <p class="text-muted small mb-0" id="chip-user">@utente</p>
    </div>
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <a href="/write" class="btn btn-primary">+ Nuovo articolo</a>
      <a href="/post" class="btn btn-outline-primary">Tutti i post</a>
      <a href="/profile" class="btn btn-outline-primary">Profilo</a>
    </div>
  </div>

  <!-- STATISTICHE COMPATTE -->
  <div class="d-flex gap-4 flex-wrap mb-4">
    <div>
      <div class="db-kpi-num" id="hero-published">–</div>
      <div class="db-kpi-label">Pubblicati</div>
    </div>
    <div>
      <div class="db-kpi-num" id="hero-drafts">–</div>
      <div class="db-kpi-label">Bozze</div>
    </div>
    <div>
      <div class="db-kpi-num" id="hero-likes">–</div>
      <div class="db-kpi-label">Like totali</div>
    </div>
  </div>

  <!-- DUE COLONNE: BOZZE + PUBBLICATI -->
  <div class="row g-3">

    <!-- Bozze -->
    <div class="col-12 col-lg-4">
      <div class="card-wrapper h-100">
        <div class="card card-bg h-100">
          <div class="card-body">
            <div class="db-kpi-label mb-3">Bozze</div>
            <div id="drafts-list"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Ultimi pubblicati -->
    <div class="col-12 col-lg-8">
      <div class="card-wrapper h-100">
        <div class="card card-bg h-100">
          <div class="card-body">
            <div class="db-kpi-label mb-3">Ultimi articoli pubblicati</div>
            <div id="published-list"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="callout note mt-4" id="empty-dashboard" style="display:none">
    <div class="callout-title">Nessun contenuto ancora</div>
    <p class="mb-2">Non hai ancora scritto nessun articolo.</p>
    <a class="btn btn-primary" href="/write">+ Crea il primo articolo</a>
  </div>

</main>
