<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@200;300;400;600;700&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  body { margin: 0; background: #eceff1; font-family: "Titillium Web", "Helvetica Neue", Helvetica, sans-serif; }
</style>
</helmet>
<div style="width: 2400px; height: 900px; position: relative; overflow: hidden; background: #fcfcfc; font-family: 'Titillium Web', 'Helvetica Neue', Helvetica, sans-serif;">

  <!-- griglia tecnica del sito, sfumata ai bordi -->
  <div style="position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(23,23,23,0.055) 1px, transparent 1px), linear-gradient(to bottom, rgba(23,23,23,0.055) 1px, transparent 1px); background-size: 60px 60px; -webkit-mask-image: radial-gradient(120% 115% at 50% 50%, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 55%, rgba(0,0,0,0) 88%); mask-image: radial-gradient(120% 115% at 50% 50%, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 55%, rgba(0,0,0,0) 88%);"></div>

  <!-- polvere colorata "ovunque": nuvole sfumate nella palette dell'evento,
       alcune sbordano a sinistra della foto come colore volato via -->
  <div style="position: absolute; left: 26%; top: -22%; width: 760px; height: 660px; background: radial-gradient(closest-side, rgba(255,45,135,0.34), rgba(255,45,135,0) 100%); filter: blur(60px);"></div>
  <div style="position: absolute; left: 41%; top: 2%; width: 600px; height: 600px; background: radial-gradient(closest-side, rgba(255,198,26,0.30), rgba(255,198,26,0) 100%); filter: blur(64px);"></div>
  <div style="position: absolute; left: 34%; bottom: -24%; width: 680px; height: 600px; background: radial-gradient(closest-side, rgba(15,178,239,0.30), rgba(15,178,239,0) 100%); filter: blur(66px);"></div>
  <div style="position: absolute; left: 44%; top: 34%; width: 480px; height: 420px; background: radial-gradient(closest-side, rgba(138,92,246,0.24), rgba(138,92,246,0) 100%); filter: blur(64px);"></div>
  <div style="position: absolute; right: 3%; bottom: 4%; width: 540px; height: 540px; background: radial-gradient(closest-side, rgba(138,92,246,0.26), rgba(138,92,246,0) 100%); filter: blur(58px);"></div>
  <div style="position: absolute; left: 1%; bottom: 0%; width: 460px; height: 380px; background: radial-gradient(closest-side, rgba(255,45,135,0.13), rgba(255,45,135,0) 100%); filter: blur(72px);"></div>

  <!-- la foto: bambini che corrono lanciando polveri e vernice. Occupa la
       destra e sborda appena il bordo; trascinala/zoomala nello slot. -->
  <div style="position: absolute; right: -50px; top: 36px; width: 1180px; height: 828px;">
    <image-slot id="colorrun-photo" shape="rounded" radius="18" fit="cover" style="width: 1180px; height: 828px;" placeholder="bambini che corrono lanciando polveri colorate e vernice — luce piena, movimento, spazio libero verso sinistra"></image-slot>
  </div>

  <!-- sfumatura bianca sul bordo sinistro della foto, così il titolo resta pulito -->
  <div style="position: absolute; left: 1108px; top: 0; width: 380px; height: 900px; background: linear-gradient(90deg, #fcfcfc 0%, rgba(252,252,252,0.72) 34%, rgba(252,252,252,0) 100%); pointer-events: none;"></div>

  <!-- testo a sinistra -->
  <div style="position: absolute; left: 132px; top: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; max-width: 1040px;">
    <div style="font-size: 30px; font-weight: 600; letter-spacing: 0.2em; color: #0a5f86; text-transform: uppercase;">Domenica 20 settembre 2026</div>
    <div style="margin-top: 22px; font-size: 168px; font-weight: 400; line-height: 0.9; letter-spacing: -0.03em; color: #171717;">Color Runner</div>
    <div style="margin-top: 34px; font-size: 37px; font-weight: 300; line-height: 1.32; color: #525252; max-width: 640px; text-wrap: pretty;">Camminata a colori, non competitiva — per le vie di Rivalta sul Mincio</div>
    <div style="margin-top: 34px; display: flex; align-items: center; gap: 18px;">
      <div style="width: 52px; height: 3px; background: #00A6EB;"></div>
      <div style="font-size: 27px; color: #525252;">Ritrovo in Piazza Chiesa, dalle 15:30</div>
    </div>
  </div>

  <!-- marchio in basso a sinistra, come sugli altri pezzi -->
  <div style="position: absolute; left: 132px; bottom: 62px; display: flex; align-items: center; gap: 18px;">
    <div style="width: 66px; height: 66px; flex: none; background: #00A6EB; clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); display: flex; align-items: center; justify-content: center;">
      <svg width="42" height="26" viewBox="0 0 24 14" fill="none" aria-hidden="true">
        <path d="M1 4.6c2.6-3 5.1-3 7.7 0s5.1 3 7.7 0 5.1-3 6.6-1.2" stroke="#ffffff" stroke-width="1.7" stroke-linecap="square"></path>
        <path d="M1 10.2c2.6-3 5.1-3 7.7 0s5.1 3 7.7 0 5.1-3 6.6-1.2" stroke="#ffffff" stroke-width="1.7" stroke-linecap="square"></path>
      </svg>
    </div>
    <div style="font-size: 27px; font-weight: 600; letter-spacing: -0.01em; color: #171717;">Rivalta sul Mincio</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:2400,&quot;height&quot;:900}}"></script>
</body>
</html>
