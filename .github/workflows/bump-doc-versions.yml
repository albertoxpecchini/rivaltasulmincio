name: Bump versioni documenti legali

# Si attiva quando privacy, cookie o note-legali vengono modificati su main.
# Per ogni file cambiato: legge la versione attuale da Supabase, incrementa
# il numero minore (X.Y → X.Y+1), aggiorna effective_date a oggi e salva le note.

on:
  push:
    branches: [main]
    paths:
      - privacy
      - cookie
      - note-legali

  # Trigger manuale: utile per forzare un bump senza toccare i file
  workflow_dispatch:
    inputs:
      documents:
        description: 'Documenti da aggiornare (es. "privacy cookie" oppure "all")'
        required: false
        default: all

concurrency:
  group: bump-doc-versions
  cancel-in-progress: false   # accoda, non cancella

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # HEAD + HEAD~1 per il diff

      # ── Rileva quali file legali sono cambiati ────────────────────────────
      - name: Rileva file da aggiornare
        id: detect
        env:
          EVENT:   ${{ github.event_name }}
          WD_DOCS: ${{ github.event.inputs.documents }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$WD_DOCS" = "all" ] || [ -z "$WD_DOCS" ]; then
              FILES="privacy cookie note-legali"
            else
              # Filtra nomi validi, accetta sia spazi che virgole come separatori
              FILES=$(echo "$WD_DOCS" | tr ',' ' ' | xargs -n1 \
                | grep -E '^(privacy|cookie|note-legali)$' | xargs || true)
            fi
          else
            # push: confronta HEAD con il commit precedente
            if git rev-parse HEAD~1 &>/dev/null; then
              FILES=$(git diff --name-only HEAD~1 HEAD \
                | grep -E '^(privacy|cookie|note-legali)$' | xargs || true)
            else
              FILES=""   # primo commit nel repo: niente da confrontare
            fi
          fi

          echo "files=$FILES" >> $GITHUB_OUTPUT

          if [ -n "$FILES" ]; then
            echo "📄 Documenti rilevati: $FILES"
          else
            echo "ℹ️  Nessun documento legale modificato (o nessun commit precedente)."
          fi

      # ── Bump versioni su Supabase ────────────────────────────────────────
      - name: Bump versioni su Supabase
        if: steps.detect.outputs.files != ''
        env:
          SB_URL:  ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://tljwxymcavgpzntksjtx.supabase.co' }}
          SB_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
          # Il messaggio del commit viene passato come env var per evitare injection lato shell
          COMMIT_MSG: ${{ github.event.head_commit.message || 'workflow_dispatch manuale' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Verifica secret
          if [ -z "$SB_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY mancante."
            echo "::error::Aggiungilo in: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

          TODAY=$(date -u +%Y-%m-%d)
          SHORT_SHA="${COMMIT_SHA:0:7}"
          FAILED=0

          for SLUG in ${{ steps.detect.outputs.files }}; do
            echo "──────────────────────────────────────────────────"
            echo "📝 Documento: $SLUG"

            # ── Leggi versione corrente ───────────────────────────────────
            RESP=$(curl -sf \
              "${SB_URL}/rest/v1/doc_versions?slug=eq.${SLUG}&select=version" \
              -H "apikey: ${SB_KEY}" \
              -H "Authorization: Bearer ${SB_KEY}" \
              || echo '[]')

            CURRENT=$(echo "$RESP" | jq -r '.[0].version // "1.0"')
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            NEW_VERSION="${MAJOR}.$((MINOR + 1))"

            echo "   ${CURRENT} → ${NEW_VERSION}  (${TODAY})"

            # ── Costruisci payload (jq gestisce l'escaping dei caratteri speciali) ──
            PAYLOAD=$(jq -n \
              --arg slug    "$SLUG" \
              --arg version "$NEW_VERSION" \
              --arg date    "$TODAY" \
              --arg notes   "commit ${SHORT_SHA}: ${COMMIT_MSG}" \
              '{ slug: $slug, version: $version, effective_date: $date, notes: $notes }')

            # ── Upsert su Supabase ────────────────────────────────────────
            HTTP_CODE=$(curl -s -o /tmp/sb_out.json -w "%{http_code}" \
              -X POST "${SB_URL}/rest/v1/doc_versions" \
              -H "apikey: ${SB_KEY}" \
              -H "Authorization: Bearer ${SB_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates" \
              -d "$PAYLOAD")

            if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "201" || "$HTTP_CODE" == "204" ]]; then
              echo "   ✅ Salvato: v${NEW_VERSION}"
            else
              echo "::error::❌ ${SLUG} — HTTP ${HTTP_CODE}: $(cat /tmp/sb_out.json)"
              FAILED=$((FAILED + 1))
            fi
          done

          echo "──────────────────────────────────────────────────"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} aggiornamento/i fallito/i."
            exit 1
          fi
          echo "✨ Tutte le versioni aggiornate."
          echo ""
          echo "ℹ️  Il server Vercel aggiorna la cache entro ~5 minuti (stale-while-revalidate)."
          echo "   Per propagazione immediata: PATCH /api/doc-versions/:slug con JWT admin."
