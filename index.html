<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Sito in manutenzione | Pro Loco Rivalta sul Mincio</title>
    <meta name="description" content="Il sito della Pro Loco Rivalta sul Mincio è temporaneamente in manutenzione. Torneremo presto online." />
    <meta name="theme-color" content="#1b5e57" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A0%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />

    <style>
      :root {
        --verde: #1b5e57;
        --verde-chiaro: #2e8b7f;
        --crema: #f7f4ec;
        --testo: #243b39;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--testo);
        background:
          radial-gradient(1200px 600px at 50% -10%, rgba(46, 139, 127, 0.18), transparent 60%),
          linear-gradient(180deg, var(--crema) 0%, #eef2ec 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      main {
        max-width: 560px;
        width: 100%;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--verde);
        background: rgba(46, 139, 127, 0.12);
        padding: 8px 16px;
        border-radius: 999px;
        margin-bottom: 28px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--verde-chiaro);
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      h1 {
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        line-height: 1.15;
        margin: 0 0 16px;
        color: var(--verde);
      }
      p {
        font-size: 1.05rem;
        line-height: 1.6;
        margin: 0 auto;
        max-width: 44ch;
        color: var(--testo);
        opacity: 0.9;
      }
      .firma {
        margin-top: 40px;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--verde);
      }
      .firma small {
        display: block;
        font-weight: 400;
        opacity: 0.7;
        margin-top: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        .dot { animation: none; }
      }
    </style>
  </head>

  <body>
    <main>
      <span class="badge"><span class="dot"></span> Manutenzione in corso</span>
      <h1>Sito in manutenzione</h1>
      <p>
        Stiamo lavorando per migliorare il sito della Pro Loco Rivalta sul Mincio.
        Torneremo online il prima possibile. Grazie per la pazienza.
      </p>
      <div class="firma">
        Pro Loco Rivalta sul Mincio
        <small>Valli del Mincio · Mantova</small>
      </div>
    </main>
  </body>
</html>
